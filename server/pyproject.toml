[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financebuddy-server"
version = "0.1.0"
description = "FinanceBuddy AI personal finance platform — API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "redis>=5.1",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "pyotp>=2.9",
    "webauthn>=2.2",
    "cryptography>=43.0",
    "ofxparse>=0.21",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "structlog>=24.4",
    "langchain-core>=0.3.15",
    "langgraph>=0.2.45",
]

[project.optional-dependencies]
llm = [
    "langchain-openai>=0.2.8",
    "langchain-anthropic>=0.2.10",
    "langchain-google-genai>=2.0.5",
]
obs = [
    "langfuse>=2.53",
    "openinference-instrumentation-langchain>=0.1.29",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "ragas>=0.2.6",
    "deepchecks>=0.18",
    "comet-ml[opik]>=3.44",
]
ocr = ["pytesseract>=0.3.13", "pillow>=10.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
