# FinanceBuddy PRODUCTION stack — real users, no demo data.
# Start with start-prod.ps1 / start-prod.sh (or:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build)
# Fully separate from the demo: own project name, database, Redis, volumes and network.
# Postgres and Redis are not published on host ports; only the API and web are.
# Put a TLS-terminating reverse proxy (nginx, Caddy, a cloud load balancer) in front of them.
name: financebuddy-prod

x-api-env: &api-env
  env_file: .env.production
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: schema migrations + shared reference data (categories, FX, knowledge). Never the demo user.
  migrate:
    build:
      context: ./server
    <<: *api-env
    command: sh -c "alembic upgrade head && python -m app.seed --reference-only"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./server
    <<: *api-env
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Production does not run the event consumer in-process, so it gets its own container.
  worker:
    build:
      context: ./server
    <<: *api-env
    restart: unless-stopped
    command: python -m app.workers.event_consumer
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
        VITE_DEMO_MODE: "false"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  pgdata_prod:
  redisdata_prod:
