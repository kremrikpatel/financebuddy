# FinanceBuddy DEMO stack — throw-away data with a seeded demo account.
# Start with start-demo.ps1 / start-demo.sh (or:
#   docker compose -f docker-compose.demo.yml --env-file .env.demo up -d --build)
# Fully separate from production: own project name, database, Redis, volume and network.
name: financebuddy-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DEMO_DB_PORT:-5433}:5432"
    volumes:
      - pgdata_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${DEMO_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
    env_file: .env.demo
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    # Migrate, (re)seed the demo account (idempotent), then serve. APP_ENV=demo runs the
    # event consumer in-process, so no separate worker container is needed.
    command: sh -c "alembic upgrade head && python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_DEMO_MODE: "true"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata_demo:
