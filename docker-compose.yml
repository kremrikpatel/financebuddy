version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: financebuddy
      POSTGRES_PASSWORD: financebuddy
      POSTGRES_DB: financebuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financebuddy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://financebuddy:financebuddy@postgres:5432/financebuddy
      REDIS_URL: redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://financebuddy:financebuddy@postgres:5432/financebuddy
      REDIS_URL: redis://redis:6379/0
    command: python -m app.workers.event_consumer
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
    command: npm run preview -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
