name: Publish tag

# Actions → Publish tag → Run workflow, or: gh workflow run publish-tag.yml -f version=1.2.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-tag

jobs:
  tag:
    # Only cut releases from the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump manifests, commit, tag, push
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$(bash scripts/set-version.sh "$INPUT_VERSION")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $tag" || echo "manifests already at $version"
          git tag -a "$tag" -m "Release $tag"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
